<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IndiaStockPro - FYERS Authentication</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .card {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .success {
            color: #16803c;
            font-weight: 600;
        }

        .error {
            color: #b42318;
            font-weight: 600;
        }

        .code-box {
            margin-top: 20px;
            padding: 15px;
            background: #f2f2f7;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .warning {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>IndiaStockPro</h1>

    <div id="result">
        Processing FYERS authentication...
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);

    const authCode = params.get("auth_code");
    const state = params.get("state");

    const result = document.getElementById("result");

    if (authCode) {

        result.innerHTML = `
            <p class="success">
                ✓ FYERS authentication successful
            </p>

            <p>
                Authorization code received successfully.
            </p>

            <div class="code-box">
                <strong>Auth Code:</strong><br>
                ${authCode}
            </div>

            <div class="code-box">
                <strong>State:</strong><br>
                ${state || "Not returned"}
            </div>

            <p class="warning">
                Keep this authorization code private.
                Do not share screenshots containing the code.
            </p>
        `;

    } else {

        result.innerHTML = `
            <p class="error">
                No FYERS authorization code received.
            </p>

            <p>
                This page is ready to receive the FYERS login callback.
            </p>
        `;
    }
</script>

</body>
</html>

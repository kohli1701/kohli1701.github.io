<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IndiaStockPro - FYERS Authentication</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 40px 20px;
        }

        .card {
            max-width: 650px;
            margin: 60px auto;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .success {
            color: #16883e;
            font-weight: 600;
        }

        .error {
            color: #c62828;
            font-weight: 600;
        }

        .status {
            color: #555;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 20px;
            background: #007aff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>IndiaStockPro</h1>

    <div id="result">
        <p class="status">
            Processing FYERS authentication...
        </p>
    </div>

</div>

<script>
(function () {

    const result = document.getElementById("result");

    const params = new URLSearchParams(window.location.search);

    const authCode = params.get("auth_code");
    const state = params.get("state");

    if (!authCode) {

        result.innerHTML = `
            <p class="error">
                No FYERS authorization code received.
            </p>

            <p class="status">
                This page is ready to receive the FYERS login callback.
            </p>
        `;

        return;
    }

    /*
        Return the authorization result to IndiaStockPro.

        The auth code is NOT displayed on this webpage.
        No FYERS Secret ID or access token is stored here.
    */

    const appURL =
        "indiastockpro://fyers-auth" +
        "?auth_code=" + encodeURIComponent(authCode) +
        "&state=" + encodeURIComponent(state || "");

    result.innerHTML = `
        <p class="success">
            ✓ FYERS authentication successful
        </p>

        <p class="status">
            Returning to IndiaStockPro...
        </p>

        <a class="button" id="openApp" href="#">
            Open IndiaStockPro
        </a>
    `;

    const openButton = document.getElementById("openApp");

    openButton.href = appURL;

    /*
        Attempt to return automatically.
        The button remains available in case the browser
        does not allow automatic opening.
    */

    setTimeout(function () {
        window.location.href = appURL;
    }, 600);

})();
</script>

</body>
</html>
